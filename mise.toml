[settings]
task.output = "interleave"

[tools]
gitleaks = "8.30.1"
markdownlint-cli2 = "0.24.1"
node = "26.13.1" # For markdownlint-cli
prek = "0.5.11"
python = "3.15.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
trivy = "0.76.2"
trufflehog = "3.99.9"
uv = "0.13.9"

# PYPI packages
"pypi:detect-secrets" = "1.5.0"
"pypi:ansible-core" = { version = "2.22.0", expose = [
    "ansible-lint==26.11.0",
    "yamllint==1.38.0",
    "molecule==26.11.0",
], with = [
    "molecule-plugins[docker]==26.11.0",
] }

