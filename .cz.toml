[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_scheme = "semver"
version_files = [
    ".version",
]
tag_format = "$version"
annotated_tag = true
annotated_tag_message = "Release $new_version"
update_changelog_on_bump = true
major_version_zero = false
bump_message = "chore(release): $current_version -> $new_version"
